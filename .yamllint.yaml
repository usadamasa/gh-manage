yaml-files:
  - '*.yaml'
  - '*.yml'

ignore:
  - bin/
  - tmp/
  - rendered/

# https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

rules:
  line-length: disable
  document-start: disable
  comments:
    level: error
  comments-indentation:
    level: error
  truthy:
    level: error
