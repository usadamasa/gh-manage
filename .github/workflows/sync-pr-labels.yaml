# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# PR が閉じる issue の種類と area のラベルを PR へ写す reusable workflow。呼び方は README の「PR のラベル同期」
name: sync-pr-labels

"on":
  workflow_call:
    inputs:
      copy-pattern:
        description: 'PR へ写すラベルの正規表現 (jq の test)。空なら種類 (bug など) と area: *'
        type: string
        required: false
        default: ''

jobs:
  sync:
    # fork と dependabot の PR は token に書き込み権限が無い。dependabot は自分で dependencies を付ける
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sync-pr-labels-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # 呼び出し側の job が同じ権限を付けていないと、ここで宣言しても上がらない
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # github.* は呼び出し側を指す。スクリプトはこの workflow を定義した repo と commit から取る
      - name: Resolve workflow source
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # 空のまま checkout へ渡すと、呼び出し側の repo を黙って取る
        run: |
          printf 'workflow source: %s@%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          test -n "$WORKFLOW_REPOSITORY" && test -n "$WORKFLOW_SHA"

      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .sync-pr-labels
          sparse-checkout: scripts/sync-pr-labels.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy labels from closing issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COPY_PATTERN: ${{ inputs.copy-pattern }}
        run: ./.sync-pr-labels/scripts/sync-pr-labels.sh "$PR_NUMBER"
