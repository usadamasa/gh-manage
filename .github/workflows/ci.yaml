name: CI

"on":
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ruleset の required_status_checks が参照する名前｡needs の job が失敗かキャンセルになったときに失敗する｡
  ci-status-check:
    runs-on: ubuntu-slim
    if: always()
    timeout-minutes: 10
    needs:
      - test
      - lint
      - actions-lock
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  actions-lock:
    name: Actions lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # aqua の go_install パッケージ (govulncheck など) は手元の Go でビルドされる｡
      # 古い Go でビルドすると go.mod より新しい言語バージョンを読めないので､先に setup-go する｡
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: $/.github/actions/setup-aqua

      - name: Check formatting
        run: |
          task format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted properly"
            git diff
            exit 1
          fi

      - name: Run linters and architecture metrics
        run: task lint
