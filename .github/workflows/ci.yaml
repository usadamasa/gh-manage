name: CI

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ruleset の required_status_checks が参照する名前｡needs の job が失敗かキャンセルになったときに失敗する｡
  ci-status-check:
    runs-on: ubuntu-slim
    if: always()
    timeout-minutes: 10
    needs:
      - test
      - lint
      - actions-lock
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  actions-lock:
    name: Actions lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/actions/verify-actions-lock

  # Go と lint のツールは flake.nix の devShell から取る (setup-nix)。
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/actions/setup-nix

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # analyze-modularity は揮発性を git の履歴から測る。shallow clone だと判定が効かない
          fetch-depth: 0

      - uses: $/actions/setup-nix

      - name: Check formatting
        run: |
          task format
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted properly"
            git diff
            exit 1
          fi

      - name: Run linters and architecture metrics
        run: task lint
