name: 'Setup Aqua'
description: 'Install and cache Aqua package manager and its tools'

inputs:
  aqua_version:
    description: 'Version of Aqua to install'
    required: false
    default: 'v2.53.3'

runs:
  using: 'composite'
  steps:
    - name: Install Aqua
      uses: aquaproj/aqua-installer@5e54e5cee8a95ee2ce7c04cb993da6dfad13e59c # v3.1.2
      with:
        aqua_version: ${{ inputs.aqua_version }}

    - name: Cache Aqua tools
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.local/share/aquaproj-aqua
        key: ${{ runner.os }}-aqua-${{ hashFiles('aqua.yaml') }}-${{ hashFiles('aqua/registry.yaml') }}
        restore-keys: |
          ${{ runner.os }}-aqua-

    - name: Install tools with Aqua
      run: aqua install
      shell: bash
      env:
        AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua/policy.yaml
