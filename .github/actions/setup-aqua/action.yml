name: 'Setup Aqua'
description: 'Install and cache Aqua package manager and its tools'

inputs:
  aqua_version:
    description: 'Version of Aqua to install'
    required: false
    default: 'v2.63.0'

runs:
  using: 'composite'
  steps:
    - name: Install Aqua
      uses: aquaproj/aqua-installer@v4.0.5
      with:
        aqua_version: ${{ inputs.aqua_version }}

    - name: Cache Aqua tools
      uses: actions/cache@v6.1.0
      with:
        path: ~/.local/share/aquaproj-aqua
        # go_install のパッケージはビルドした Go に依存するので go.mod もキーに含める｡
        # 前方一致の restore-keys は古い Go でビルドしたバイナリを戻してしまうので置かない｡
        key: ${{ runner.os }}-aqua-${{ hashFiles('aqua.yaml') }}-${{ hashFiles('aqua/registry.yaml') }}-${{ hashFiles('go.mod') }}

    - name: Install tools with Aqua
      run: aqua install
      shell: bash
      env:
        AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua/policy.yaml
