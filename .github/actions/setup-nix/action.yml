name: 'Setup Nix'
description: 'Install Nix and load the flake devShell into the following steps'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23

    # nix-develop が devShell の PATH と env を後続の step へ渡す｡
    - name: Load devShell
      uses: nicknovitski/nix-develop@v1.2.1
