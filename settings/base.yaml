# yaml-language-server: $schema=./schema.json
# 全リポジトリ共通の設定｡repos/<name>.yaml は base との差分だけを書く (snapshot --minimize)｡
# 2026-09 の bootstrap は agents-daemon 1 リポジトリから始め､2026-10 に archived と fork を除く 16 リポジトリへ広げた｡
# 値は多数派に揃えてあり､外れるリポジトリは overlay に理由を書く｡
prune:
  rulesets: false
  variables: false
  secrets: false
  dependabot_secrets: false
  labels: true
# 管理下のリポジトリに必ず付ける topic｡GitHub 側で管理対象を見分ける印で､plan が desired の topics に足す
managed_topic: gh-managed
repository:
  visibility: public
  default_branch: main
  is_template: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: false
  allow_forking: true
  allow_squash_merge: false
  allow_merge_commit: true
  allow_rebase_merge: false
  allow_auto_merge: true
  allow_update_branch: false
  delete_branch_on_merge: true
  web_commit_signoff_required: false
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
rulesets:
  main:
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - merge
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
          required_reviewers: []
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: false
          required_status_checks:
            # go-template 由来の CI が出す集約 job
            - context: ci-status-check
              integration_id: 15368
          strict_required_status_checks_policy: false
# tagpr の GitHub App の認証情報｡tagpr の workflow が vars.TAGPR_CLIENT_ID と secrets.TAGPR_PRIVATE_KEY を参照する
variables:
  TAGPR_CLIENT_ID:
    from_env: TAGPR_CLIENT_ID
secrets:
  TAGPR_PRIVATE_KEY:
    from_env: TAGPR_PRIVATE_KEY
# 種類・優先度・epic の軸は全リポジトリで揃える (運用は skill labeling-github-issues)｡area: と tool のラベルは repo ごとに足す
labels:
  # 種類
  bug:
    color: "d73a4a"
    description: "Something isn't working"
  enhancement:
    color: "a2eeef"
    description: "New feature or request"
  documentation:
    color: "0075ca"
    description: "Improvements or additions to documentation"
  refactor:
    color: "c5def5"
    description: "振る舞いを変えない内部構造の整理"
  investigation:
    color: "d4c5f9"
    description: "検討・triage・前提の裏取り"
  epic:
    color: "3e4b9e"
    description: "sub-issue を束ねる親 issue"
  duplicate:
    color: "cfd3d7"
    description: "This issue or pull request already exists"
  wontfix:
    color: "ffffff"
    description: "This will not be worked on"
  # 優先度
  "priority: high":
    color: "b60205"
    description: "優先度: 高"
  "priority: medium":
    color: "d93f0b"
    description: "優先度: 中"
  "priority: low":
    color: "fbca04"
    description: "優先度: 低"
