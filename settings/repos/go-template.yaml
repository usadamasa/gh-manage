# yaml-language-server: $schema=../schema.json
# template リポジトリ｡allowed_merge_methods に squash と rebase を残し､required_status_checks に integration_id を付けないのは意図した差分
repository:
  is_template: true
rulesets:
  main:
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
          required_reviewers: []
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: false
          required_status_checks:
            - context: ci-status-check
          strict_required_status_checks_policy: false
labels:
  # tagpr と Dependabot が付ける
  tagpr:
    color: "ededed"
  "tagpr:minor":
    color: "ededed"
  "tagpr:major":
    color: "ededed"
  dependencies:
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  github_actions:
    color: "000000"
    description: "Pull requests that update GitHub Actions code"
  nix:
    color: "3E6399"
    description: "Pull requests that update nix code"
