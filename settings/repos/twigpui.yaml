# yaml-language-server: $schema=../schema.json
repository:
  has_projects: true
  has_discussions: true
rulesets:
  main:
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - merge
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
          required_reviewers: []
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: false
          required_status_checks:
            - context: ci-status-check
              integration_id: 15368
          strict_required_status_checks_policy: true
      - type: code_coverage
        parameters:
          max_coverage_drop: null
          minimum_coverage: null
labels:
  # Dependabot が付ける
  dependencies:
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  github_actions:
    color: "000000"
    description: "Pull requests that update GitHub Actions code"
  rust:
    color: "000000"
    description: "Pull requests that update rust code"
  # issue の状態
  question:
    color: "d876e3"
    description: "Further information is requested"
  blocked:
    color: "e4e669"
    description: "Waiting on another issue"
  # 機能の領域
  "area: api":
    color: "1d76db"
    description: "X API client, quotas, rate limits"
  "area: auth":
    color: "1d76db"
    description: "Authentication and OAuth"
  "area: ui":
    color: "5319e7"
    description: "gpui window, layout, theming"
  "area: cache":
    color: "c2e0c6"
    description: "Local cache and persistence"
  "area: timeline":
    color: "5319e7"
    description: "Timeline fetching and rendering"
  "area: config":
    color: "c2e0c6"
    description: "Configuration and file locations"
  "area: cost":
    color: "d4c5f9"
    description: "API spend visibility and control"
  "area: tui":
    color: "5319e7"
    description: "Terminal UI mode"
