# yaml-language-server: $schema=../schema.json
# repository と rulesets は base のまま｡allowed_merge_methods は base の merge だけに合わせる (bootstrap の drift 修正)
# GH_MANAGE_TOKEN と WORKBENCH_TOKEN は gh-manage 自身の workflow が使う secret で､値は手で置く (docs/setup-token.md)｡
# GH_AUTOMATION_TOKEN は他のリポジトリへ配る値の置き場で､gh-manage 自身へは配らない｡どれも配布物ではないので data にする
data:
  secrets:
    - GH_MANAGE_TOKEN
    - WORKBENCH_TOKEN
    - GH_AUTOMATION_TOKEN
topics: [tier-2]
labels:
  # 過去の issue に付いている
  chore:
    color: "ededed"
  # Dependabot が付ける
  dependencies:
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  github_actions:
    color: "000000"
    description: "Pull requests that update GitHub Actions code"
  go:
    color: "16e2e2"
    description: "Pull requests that update go code"
  nix:
    color: "3E6399"
    description: "Pull requests that update nix code"
