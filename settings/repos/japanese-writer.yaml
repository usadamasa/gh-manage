# yaml-language-server: $schema=../schema.json
# repository と rulesets は base のまま｡ruleset の allowed_merge_methods と do_not_enforce_on_create は base に合わせる (bootstrap の drift 修正)
topics: [tier-1]
labels:
  # tagpr と Dependabot が付ける
  tagpr:
    color: "ededed"
  "tagpr:minor":
    color: "ededed"
  "tagpr:major":
    color: "ededed"
  dependencies:
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  github_actions:
    color: "000000"
    description: "Pull requests that update GitHub Actions code"
  nix:
    color: "3E6399"
    description: "Pull requests that update nix code"
  # 機能の領域
  "area: writing-gate":
    color: "1d76db"
    description: "Stop hook の writing-gate (Go の CLI、phrase rule、gate-off / gate-on)"
  "area: textlint":
    color: "1d76db"
    description: "textlint-check と同梱の textlint config、prh のルール"
  "area: proofread":
    color: "1d76db"
    description: "proofread skill、proofreader subagent、sanitize-artifacts"
  "area: tech-writing":
    color: "1d76db"
    description: "japanese-tech-writing の文章規範"
  "area: feedback":
    color: "1d76db"
    description: "writing-feedback、writing-retrospective、crit の approve 後の prompt"
  "area: setup":
    color: "1d76db"
    description: "setup skill、SessionStart hook による writing-gate のビルドと data ディレクトリの準備"
  "area: dev":
    color: "1d76db"
    description: "CI、lint、テスト、Taskfile、flake、保守用の skill と docs"
