# yaml-language-server: $schema=../schema.json
# repository は visibility だけ base と違う｡has_projects と allow_auto_merge は base に合わせる (bootstrap の drift 修正)
# visibility は private のまま｡git の履歴に public にできない fixture が残り､refs/pull/1/head から辿れるので
# ブランチの履歴を書き直しても消えない (refs/pull は自分で消せず GitHub Support への依頼が要る)｡public にするなら新しいリポジトリへ作り直す
# rulesets は base のまま｡ruleset main の include: [] (何も守っていない) は base の ~DEFAULT_BRANCH に直す
# GH_AUTOMATION_TOKEN は update-flake-lock の workflow が PR を作る PAT (private では Dependabot の nix が使えない)
repository:
  visibility: private
topics: [tier-2]
secrets:
  GH_AUTOMATION_TOKEN:
    from_env: GH_AUTOMATION_TOKEN
labels:
  # tagpr が付ける
  tagpr:
    color: "ededed"
  "tagpr:minor":
    color: "ededed"
  "tagpr:major":
    color: "ededed"
  # 機能の領域
  "area: cli":
    color: "1d76db"
    description: "cmd/acm, cmd/acm-login と internal/dl (パーサー)"
  "area: plugin":
    color: "1d76db"
    description: "plugins/ 配下のスキル・エージェント (プラグイン利用者向け)"
  "area: transport":
    color: "1d76db"
    description: "Chrome/CDP, Cookie, Cloudflare, HTTP 経路"
