# yaml-language-server: $schema=../schema.json
# private｡ruleset main は base に bypass_actors (admin) と copilot_code_review を足した形
# GH_AUTOMATION_TOKEN は update-flake-lock の workflow が PR を作る PAT (private では Dependabot の nix が使えない)
repository:
  description: 'Claude Code global configuration: skills, hooks, CLAUDE.md'
  visibility: private
topics: [tier-1]
rulesets:
  main:
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          allowed_merge_methods:
            - merge
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: false
          required_approving_review_count: 0
          required_review_thread_resolution: false
          required_reviewers: []
      - type: copilot_code_review
        parameters:
          review_draft_pull_requests: true
          review_on_push: true
      - type: required_status_checks
        parameters:
          do_not_enforce_on_create: false
          required_status_checks:
            - context: ci-status-check
              integration_id: 15368
          strict_required_status_checks_policy: false
secrets:
  GH_AUTOMATION_TOKEN:
    from_env: GH_AUTOMATION_TOKEN
labels:
  # gh-aw の workflow が付ける
  report:
    color: "ededed"
  agentic-workflows:
    color: "ededed"
  # 機能の領域
  "area: guard":
    color: "1d76db"
    description: "PreToolUse と SessionStart の guard (guard-bash など) と cc-rm"
  "area: settings":
    color: "1d76db"
    description: "settings の原本と生成、permissions・sandbox・autoMode、plugin の宣言と state の検査"
  "area: skills":
    color: "1d76db"
    description: "グローバル skill と agent (ほかの area に属さないもの)"
  "area: instructions":
    color: "1d76db"
    description: "グローバル CLAUDE.md と output style"
  "area: toolchain":
    color: "1d76db"
    description: "開発ツールの導入と解決 (nix、home-manager、aqua、direnv、PATH、gh-actions-lock)"
  "area: usage-analysis":
    color: "1d76db"
    description: "token・latency・permission の分析 (analyze-* と関連 skill)"
  "area: capture":
    color: "1d76db"
    description: "画面の撮影と表示 (cleanshot-capture、showing-images-in-rex)"
  "area: setup":
    color: "1d76db"
    description: "task setup/status/clean の symlink、shared/bin への配布、private marketplace"
  "area: dev":
    color: "1d76db"
    description: "CI、lint、テスト、Taskfile、flake、Go workspace、保守用の docs"
