# yaml-language-server: $schema=../schema.json
# repository は visibility だけ base と違う｡rulesets は base のまま
# GH_AUTOMATION_TOKEN は update-flake-lock の workflow が PR を作る PAT (private では Dependabot の nix が使えない)
repository:
  visibility: private
secrets:
  GH_AUTOMATION_TOKEN:
    from_env: GH_AUTOMATION_TOKEN
labels:
  # tagpr と Dependabot が付ける
  tagpr:
    color: "ededed"
  "tagpr:minor":
    color: "ededed"
  "tagpr:major":
    color: "ededed"
  dependencies:
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  github_actions:
    color: "000000"
    description: "Pull requests that update GitHub Actions code"
  go:
    color: "16e2e2"
    description: "Pull requests that update go code"
  # gh-aw の workflow が付ける
  report:
    color: "ededed"
  agentic-workflows:
    color: "ededed"
  # repo 独自の分類
  "track-a:ai-evolution":
    color: "5319E7"
    description: "Track A: AI Team Evolution基盤 (中長期)"
  "track-b:mcp-review":
    color: "0E8A16"
    description: "Track B: MCPレビューツール進化 (短期)"
  review-agent:
    color: "FBCA04"
    description: "レビューエージェント機能全般"
  data-model:
    color: "C5DEF5"
    description: "データモデル/スキーマ関連"
  voc:
