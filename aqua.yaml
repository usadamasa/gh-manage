---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
aqua_version: ">=2.0.0"

registries:
  - type: standard
    ref: v4.448.1 # renovate: depName=aquaproj/aqua-registry
  # 標準レジストリに無いパッケージ用｡定義は aqua/registry.yaml
  - name: local
    type: local
    path: aqua/registry.yaml

packages:
  - name: go-task/task@v3.51.1
  - name: golangci/golangci-lint@v2.13.1
  - name: golang/tools/goimports@v0.34.0
  - name: fe3dback/go-arch-lint@v1.19.0
  - name: securego/gosec@v2.28.0
  - name: golang/vuln/govulncheck@v1.7.0
  - name: fdaines/spm-go@v0.11.1
    registry: local
  - name: usadamasa/go-arch-metrics/analyze-arch-lint@2026.0919.3
    registry: local
  - name: usadamasa/go-arch-metrics/analyze-modularity@2026.0919.3
    registry: local
  - name: suzuki-shunsuke/pinact@v5.0.0
