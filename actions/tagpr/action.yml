name: 'tagpr'
description: 'Create a GitHub App token and run tagpr with it'

# 他のリポジトリからも呼ばれる共有の action。呼び方は同じディレクトリの README.md
inputs:
  client-id:
    description: 'Client ID of the GitHub App that tagpr runs as'
    required: true
  private-key:
    description: 'Private key of the GitHub App that tagpr runs as'
    required: true

outputs:
  tag:
    description: 'The semver tag, which is output only when tagpr has tagged'
    value: ${{ steps.tagpr.outputs.tag }}
  pull_request:
    description: 'Information of the pull request created by tagpr in JSON format'
    value: ${{ steps.tagpr.outputs.pull_request }}
  base_tag:
    description: 'The base semver tag for comparison, empty if no previous tag exists'
    value: ${{ steps.tagpr.outputs.base_tag }}

runs:
  using: 'composite'
  steps:
    # GITHUB_TOKEN で作った PR やタグは後続の workflow を起動しないので、App のトークンで動かす
    - uses: actions/create-github-app-token@v3.3.0
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: read

    - uses: Songmu/tagpr@v1.21.3
      id: tagpr
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
