name: 'Verify actions lock'
description: 'Install gh-actions-lock and verify that the workflows match actions.lock'

# 他のリポジトリからも呼ばれる共有の action。呼び方は同じディレクトリの README.md
runs:
  using: 'composite'
  steps:
    - name: Install gh-actions-lock
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh extension install github/gh-actions-lock --pin v0.4.0

    - name: Verify actions are locked
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh actions-lock --verify
