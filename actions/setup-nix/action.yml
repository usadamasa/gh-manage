name: 'Setup Nix devShell'
description: 'Install Nix and load the flake.nix devShell into the job environment'

# 他のリポジトリからも呼ばれる共有の action。呼び方と cache の挙動は同じディレクトリの README.md
runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23

    # 保存は job の終わり (post step) に走るので、後の nix-develop が取った devShell も入る
    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: 2G

    # devShell の PATH と env を GITHUB_PATH / GITHUB_ENV に書くので、以後の step は素で動く。
    # --profile は devShell を GC root にして、保存前の GC で消えないようにする
    - name: Load devShell
      uses: nicknovitski/nix-develop@v1.2.1
      with:
        arguments: --profile ${{ runner.temp }}/nix-devshell-profile
