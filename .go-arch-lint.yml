version: 3

workdir: .

excludeFiles:
  - ".*_test\\.go$"

# 依存の向き: entry → infra → domain､shared はどこからでも使える｡逆向きは禁止｡
# component はパッケージ単位ではなく役割単位で切る (analyze-arch-lint が singleton の多さを咎める)｡
#   entry   cmd/*, internal/cli  エントリポイントと cobra のコマンド定義
#   domain  internal/config      設定の読み込みと base + overlay の合成
#           internal/reconcile   plan / apply の差分計算
#   infra   internal/github      GitHub API クライアント (go-gh はここだけが import する)
#   shared  internal/log, internal/version
components:
  entry:
    in:
      - cmd/*
      - internal/cli
  domain:
    in:
      - internal/config
      - internal/reconcile
  infra:
    in:
      - internal/github
  shared:
    in:
      - internal/log
      - internal/version

vendors:
  cobra:
    in: github.com/spf13/cobra
  yaml:
    in: go.yaml.in/yaml/v3
  gogh:
    in:
      - github.com/cli/go-gh/v2/pkg/api
      - github.com/cli/go-gh/v2/pkg/auth

commonComponents:
  - shared

deps:
  entry:
    mayDependOn:
      - entry  # cmd/* → internal/cli
      - domain
      - infra
    canUse:
      - cobra
  domain:
    mayDependOn:
      - domain  # reconcile → config
    canUse:
      - yaml
  infra:
    mayDependOn:
      - domain
    canUse:
      - gogh
