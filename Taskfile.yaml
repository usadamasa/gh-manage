# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BINARY_NAME: gh-manage
  MAIN_PKG: ./cmd/gh-manage

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} {{.MAIN_PKG}}

  test:
    desc: Run tests with race detection and coverage
    cmds:
      - go test -race -cover ./...

  lint:
    desc: Run linters and architecture metrics
    cmds:
      - yamllint -c .yamllint.yaml .
      - check-jsonschema --check-metaschema settings/schema.json
      - check-jsonschema --schemafile settings/schema.json settings/base.yaml settings/repos/*.yaml
      - golangci-lint run --timeout 5m ./...
      - go-arch-lint check
      - analyze-arch-lint --strict .
      - analyze-modularity --strict .
      - task: vulncheck
      - gosec -quiet ./...

  vulncheck:
    desc: govulncheck を symbol モードで実行 (lint と週次の vulncheck workflow が呼ぶ)
    cmds:
      - govulncheck ./...

  vulncheck:module:
    desc: govulncheck を module モードで実行 (週次の vulncheck workflow が表示だけに使う)
    cmds:
      # -scan module はルートに Go ファイルが無いと落ちるので、main パッケージのディレクトリで回す。
      # x/crypto の GO-2026-5932 (openpgp、修正版なし) で常に exit 3 になるので合否には使わない
      - govulncheck -C cmd/gh-manage -scan module

  metrics:
    desc: Print package metrics (Ca/Ce/A/I/D) as JSON
    cmds:
      - analyze-modularity .

  format:
    desc: Format code
    cmds:
      - go mod tidy
      - goimports -w .
      - go fmt ./...

  dev:
    desc: Format, lint, and test (development cycle)
    cmds:
      - task: format
      - task: lint
      - task: test

  ci:
    desc: Run full CI checks (format, lint, test, build)
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: build

  nix:update:
    desc: Update nixpkgs in flake.lock (bumps Go and the lint tools)
    cmds:
      - nix flake update

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.*
